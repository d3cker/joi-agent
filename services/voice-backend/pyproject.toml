[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-voice-agent-backend"
version = "1.2.1"
description = "Network-first voice agent gateway for the Joi macOS client"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "markdown-it-py>=3,<5",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
speech = [
  "faster-whisper==1.2.1",
  "ctranslate2==4.6.2",
  "onnxruntime==1.23.2",
  "numpy>=1.26,<3",
]
dev = ["numpy>=1.26,<3", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["voice_agent"]

[tool.setuptools.data-files]
"skills" = ["skills/manifest.json"]
"skills/web-research" = ["skills/web-research/SKILL.md"]
"skills/open-terminal-work" = ["skills/open-terminal-work/SKILL.md"]
"skills/project-engineering" = ["skills/project-engineering/SKILL.md"]
"skills/skill-authoring" = ["skills/skill-authoring/SKILL.md"]
